{{ define "authentication/login.html" }}
<!DOCTYPE html>
<html lang="en" class="h-full">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>{{ .title }} | Work Management System</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="h-full bg-gray-900 flex items-center justify-center px-4">

  <div class="w-full max-w-md bg-gray-800 rounded-2xl shadow-xl p-8">

    <!-- Header -->
    <div class="mb-6 text-center">
      <h2 class="text-2xl font-semibold text-white">
        Welcome Back
      </h2>
      <p class="text-sm text-gray-400 mt-1">
        Sign in to continue
      </p>
    </div>

    <!-- Error -->
    {{ if .Error }}
    <div class="mb-4 rounded-lg bg-red-900/40 text-red-300 px-4 py-2 text-sm text-center">
      {{ .Error }}
    </div>
    {{ end }}

    <!-- Form -->
    <form action="/login" method="POST" class="space-y-4">

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-300 mb-1">
          Email
        </label>
        <input
          id="email"
          name="email"
          type="email"
          required
          autocomplete="email"
          class="w-full rounded-lg border border-gray-700 bg-gray-900
                 px-3 py-2 text-gray-100 placeholder-gray-500
                 focus:outline-none focus:ring-2 focus:ring-blue-500"
        />
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-300 mb-1">
          Password
        </label>

        <div class="relative">
          <input
            id="password"
            name="password"
            type="password"
            required
            autocomplete="current-password"
            class="w-full rounded-lg border border-gray-700 bg-gray-900
                   px-3 py-2 pr-10 text-gray-100 placeholder-gray-500
                   focus:outline-none focus:ring-2 focus:ring-blue-500"
          />

          <!-- Show / Hide Password -->
            <button
            type="button"
            onclick="togglePassword()"
            class="absolute inset-y-0 right-0 flex items-center px-3 text-gray-400 hover:text-gray-200"
            aria-label="Toggle password visibility"
            >
            <!-- Eye (visible) -->
            <svg id="eyeOpen" xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round"
                d="M15 12a3 3 0 11-6 0 3 3 0 016 0z" />
                <path stroke-linecap="round" stroke-linejoin="round"
                d="M2.458 12C3.732 7.943 7.523 5 12 5
                    c4.478 0 8.268 2.943 9.542 7
                    -1.274 4.057-5.064 7-9.542 7
                    -4.477 0-8.268-2.943-9.542-7z" />
            </svg>

            <!-- Eye Off (hidden) -->
            <svg id="eyeClosed" xmlns="http://www.w3.org/2000/svg"
                class="h-5 w-5 hidden"
                fill="none"
                viewBox="0 0 24 24"
                stroke="currentColor"
                stroke-width="1.8">
                <path stroke-linecap="round" stroke-linejoin="round"
                d="M13.875 18.825A10.05 10.05 0 0112 19
                    c-4.478 0-8.268-2.943-9.543-7
                    a9.956 9.956 0 012.223-3.592" />
                <path stroke-linecap="round" stroke-linejoin="round"
                d="M6.223 6.223A9.956 9.956 0 0112 5
                    c4.478 0 8.268 2.943 9.543 7
                    a9.956 9.956 0 01-4.298 5.09" />
                <path stroke-linecap="round" stroke-linejoin="round"
                d="M3 3l18 18" />
            </svg>
            </button>
        </div>
      </div>

      <!-- Forgot -->
      <div class="flex justify-end">
        <a href="/forgot-password"
           class="text-sm text-blue-400 hover:text-blue-300 hover:underline">
          Forgot password?
        </a>
      </div>

      <!-- Submit -->
      <button
        type="submit"
        class="w-full rounded-lg bg-blue-600 hover:bg-blue-700
               text-white py-2.5 font-medium transition
               focus:outline-none focus:ring-2 focus:ring-blue-500 focus:ring-offset-2
               focus:ring-offset-gray-800"
      >
        Login
      </button>
    </form>

    <!-- Footer -->
    <p class="mt-6 text-center text-xs text-gray-500">
      © 2025 Work Management System
    </p>
  </div>

  <!-- Script -->
<script>
  function togglePassword() {
    const input = document.getElementById("password");
    const eyeOpen = document.getElementById("eyeOpen");
    const eyeClosed = document.getElementById("eyeClosed");

    const isPassword = input.type === "password";

    input.type = isPassword ? "text" : "password";
    eyeOpen.classList.toggle("hidden", isPassword);
    eyeClosed.classList.toggle("hidden", !isPassword);
  }
</script>


</body>
</html>
{{ end }}
