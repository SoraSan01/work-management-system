{{ define "header" }}
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>{{ .title }} | Work Management System</title>

  <!-- Tailwind CSS -->
  <script src="https://cdn.tailwindcss.com"></script>

  <!-- Alpine.js -->
  <script defer src="https://unpkg.com/alpinejs@3.x.x/dist/cdn.min.js"></script>
  <style>
    [x-cloak] { display: none !important; }
  </style>
</head>

<body class="bg-gray-50 antialiased" x-data="{ sidebarOpen: false }">

  <div class="flex h-screen overflow-hidden">

    <!-- Sidebar -->
    {{ template "sidebar" . }}

    <!-- Main Content -->
    <div class="flex-1 flex flex-col overflow-hidden transition-all duration-300" :class="sidebarOpen ? 'lg:ml-64' : 'ml-0'">
      <!-- Top Bar -->
      {{ template "navbar" . }}

      <!-- Page Content -->
      <main class="flex-1 overflow-y-auto bg-gray-50 p-6">
{{ end }}
