{{ define "navbar" }}
<header class="bg-white border-b border-gray-200 sticky top-0 z-30 flex items-center justify-between px-6 py-4 shadow-sm"
        x-data="{ notificationOpen: false, profileOpen: false }">

    <!-- Toggle Sidebar -->
    <button @click="sidebarOpen = !sidebarOpen" class="text-gray-600 hover:text-gray-900 p-2 rounded focus:outline-none focus:ring-2 focus:ring-blue-500">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"/>
        </svg>
    </button>

    <!-- Page Title -->
    <h2 class="text-xl font-semibold text-gray-800">{{ if .pageTitle }}{{ .pageTitle }}{{ else }}Dashboard{{ end }}</h2>

    <!-- Right Actions -->
    <div class="flex items-center gap-2">
        <!-- Notifications -->
        <div class="relative">
            <button @click="notificationOpen = !notificationOpen" class="relative text-gray-600 hover:text-gray-900 p-2 rounded-lg hover:bg-gray-100 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 17h5l-1.405-1.405A2.032 2.032 0 0118 14.158V11a6.002 6.002 0 00-4-5.659V5a2 2 0 10-4 0v.341C7.67 6.165 6 8.388 6 11v3.159c0 .538-.214 1.055-.595 1.436L4 17h5m6 0v1a3 3 0 11-6 0v-1m6 0H9"/>
                </svg>
                <span class="absolute top-1 right-1 w-2 h-2 bg-red-500 rounded-full"></span>
            </button>

            <div x-show="notificationOpen" @click.away="notificationOpen = false" x-transition class="absolute right-0 mt-2 w-80 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
                <div class="px-4 py-2 border-b border-gray-200">
                    <h3 class="text-sm font-semibold text-gray-800">Notifications</h3>
                </div>
                <div class="max-h-96 overflow-y-auto">
                    {{ range .Notifications }}
                    <a href="#" class="flex items-start px-4 py-3 hover:bg-gray-50 transition">
                        <div class="flex-shrink-0">
                            <div class="w-10 h-10 rounded-full bg-blue-100 flex items-center justify-center">
                                <svg class="w-5 h-5 text-blue-600" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                                </svg>
                            </div>
                        </div>
                        <div class="ml-3 flex-1">
                            <p class="text-sm text-gray-800">{{ .Message }}</p>
                            <p class="text-xs text-gray-500 mt-1">{{ .TimeAgo }}</p>
                        </div>
                    </a>
                    {{ end }}
                </div>
            </div>
        </div>

        <!-- Profile -->
        <div class="relative">
            <button @click="profileOpen = !profileOpen" class="flex items-center text-gray-600 hover:text-gray-900 p-2 rounded-lg hover:bg-gray-100 transition">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z"/>
                </svg>
            </button>

            <div x-show="profileOpen" @click.away="profileOpen = false" x-transition class="absolute right-0 mt-2 w-56 bg-white rounded-lg shadow-lg border border-gray-200 py-2 z-50">
                <div class="px-4 py-3 border-b border-gray-200">
                    <p class="text-sm font-medium text-gray-800">{{ .User.FirstName }} {{ .User.LastName }}</p>
                    <p class="text-xs text-gray-500">{{ .User.Email }}</p>
                </div>
                <a href="/profile" class="flex items-center px-4 py-2 text-sm text-gray-700 hover:bg-gray-50 transition">My Profile</a>
                <a href="/logout" class="flex items-center px-4 py-2 text-sm text-red-600 hover:bg-red-50 transition">Sign Out</a>
            </div>
        </div>
    </div>
</header>
{{ end }}
